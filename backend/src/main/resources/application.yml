spring:
  application:
    name: tickets-for-you-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickets_for_you}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:tickets-for-you-local-development-secret-2026}
    expiration-minutes: 120

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

tmdb:
  base-url: https://api.themoviedb.org/3
  access-token: ${TMDB_ACCESS_TOKEN}

reservation:
  hold-minutes: ${RESERVATION_HOLD_MINUTES:15}
  expiration-check-ms: ${RESERVATION_EXPIRATION_CHECK_MS:60000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}